apiVersion: v1
kind: Pod
spec:
  containers:
    - name: tools
      image: alpine/git:2.54.0@sha256:a299a963fbe31628ab481ca42907bcf0691d004f86734c02638abdf513691d42
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
