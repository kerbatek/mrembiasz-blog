        - cat
      tty: true
    - name: aws
      image: amazon/aws-cli:2.28.21@sha256:aef1f233218008d23301c2480a1a9e731be8cadf5ecbeb142d4247eb7c279d1a
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
