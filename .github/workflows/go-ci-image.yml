name: Go CI Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - deploy/jenkins/go-ci.Dockerfile
      - .github/workflows/go-ci-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/jenkins/go-ci.Dockerfile
          push: true
          tags: ghcr.io/kerbatek/mrembiasz-blog-go-ci:1.25-zip
